# MySQL 8 chạy local bằng Docker:  docker compose up -d
# Sau đó: npm run db:init
services:
  mysql:
    image: mysql:8.0
    container_name: qlbanhang-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: qlbanhang
      TZ: Asia/Ho_Chi_Minh
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
